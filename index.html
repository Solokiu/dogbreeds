<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dog Breed Prediction</title>
</head>
<body>
    <h2>Dog Breed Prediction</h2>
    <form id="uploadForm">
        <label for="image">Select dog image:</label>
        <input type="file" id="image" name="image" accept="image/*" required>
        <button type="submit">Predict</button>
    </form>
    <hr>
    <div id="results"></div>

    <script>
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fileInput = document.getElementById('image');
        if (fileInput.files.length === 0) {
            document.getElementById('results').innerText = "Please select an image!";
            return;
        }
        const formData = new FormData();
        formData.append('image', fileInput.files[0]);

        fetch('https://127.0.0.1:5000/', { // Change to your Flask backend URL
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            let html = "<h3>Prediction Results:</h3><ul>";
            for (const [key, value] of Object.entries(data)) {
                html += `<li><strong>${key}:</strong> ${value}</li>`;
            }
            html += "</ul>";
            document.getElementById('results').innerHTML = html;
        })
        .catch(error => {
            document.getElementById('results').innerText = "Error: " + error;
        });
    });
    </script>
</body>
</html>
